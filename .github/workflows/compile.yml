name: Compile

on:
  workflow_dispatch:  # Запуск тільки вручну

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make compile.sh executable
        run: chmod +x compile.sh

      - name: Prepare build config
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 device-tree-compiler libyaml-dev
          sed -i 's/AK3_DEFAULT="2"/AK3_DEFAULT="1"/' compile.sh

      - name: Run compile.sh
        run: ./compile.sh --device=lahaina --compiler=gcc

      - name: Upload all ZIP files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-zip
          path: "**/*.zip"
